name: Build MoonWAD for Windows

on:
  workflow_dispatch:
  push:
    branches: [moonwad]
    paths:
      - 'moonwad/**'
      - 'pc/**'
      - 'run.py'
      - 'pyproject.toml'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the GUI and CLI executables
        shell: pwsh
        run: ./pc/build-windows.ps1
      - name: Smoke-test the CLI
        shell: pwsh
        run: |
          & ./dist/MoonWAD-CLI.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: MoonWAD-Windows
          path: |
            dist/MoonWAD.exe
            dist/MoonWAD-CLI.exe
          if-no-files-found: error
      - name: Publish build result on this commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'MoonWAD Windows build',
              description: success ? 'Windows executables built' : 'Windows executable build failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
