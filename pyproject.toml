[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonwad"
version = "0.5.0"
description = "Static Lua/Luau obfuscation analyzer for MoonSec, Prometheus and WeAreDevs loaders"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MoonWAD contributors"}]

[project.scripts]
moonwad = "moonwad.cli:main"

[tool.setuptools]
packages = ["moonwad"]
